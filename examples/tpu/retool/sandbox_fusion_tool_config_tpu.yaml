tools:
  - class_name: "examples.tpu.retool.retool_tpu.CustomSandboxFusionTool"
    config:
      sandbox_fusion_url: "http://127.0.0.1:18080/run_code"
      num_workers: 128
      enable_global_rate_limit: false
      rate_limit: 128
      default_timeout: 8
      default_language: "python"
      memory_limit_mb: 1024
      type: native

    tool_schema:
      type: "function"
      function:
        name: "code_interpreter"
        description: "A tool for executing code."
        parameters:
          type: "object"
          properties:
            code:
              type: "string"
              description: "The code to execute."
          required: ["code"]
